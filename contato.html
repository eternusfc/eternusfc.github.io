<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Contato – Eternus FC</title><link rel="stylesheet" href="assets/style.css?v=1793123906"><link id="tema" rel="stylesheet" href="assets/tema.css?v=1">
<style>
/* ---------- página de contato ---------- */
.ct{position:relative;max-width:760px}
.ct-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--claro);margin-bottom:14px}
.ct-eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--claro);box-shadow:0 0 0 0 rgba(224,80,107,.6);animation:pulso 2s infinite}
.ct h2{font-size:clamp(34px,8vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:0 0 14px}
.ct-sub{color:var(--cinza);font-size:16px;max-width:440px;margin:0 0 28px}
.ct-cta{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;font-size:16px;font-weight:600;border-radius:12px;box-shadow:0 8px 28px rgba(143,23,48,.35);transition:transform .15s,box-shadow .15s,background .15s}
.ct-cta:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(168,29,56,.45)}
.ct-cta svg{width:20px;height:20px}
.ct-cta span{transition:transform .15s}.ct-cta:hover span{transform:translateX(3px)}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px;margin-top:40px}
.ct-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--suave);border:1px solid var(--linha);border-radius:14px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,background .15s;min-width:0}
a.ct-card:hover{transform:translateY(-2px);border-color:var(--bordo);background:#1c1719}
a.ct-card:hover .ct-seta{color:var(--claro);transform:translateX(3px)}
.ct-ico{width:42px;height:42px;border-radius:12px;background:rgba(143,23,48,.22);color:var(--claro);display:grid;place-items:center;flex:none}
.ct-ico svg{width:20px;height:20px}
.ct-txt{flex:1;min-width:0}
.ct-txt small{display:block;color:var(--cinza);font-size:12px}
.ct-txt strong{display:block;font-weight:500;font-size:15px;overflow-wrap:anywhere}
.ct-seta{color:var(--cinza);flex:none;transition:transform .15s,color .15s;font-size:18px}
.ct-card.info-fixa{grid-column:1/-1;background:transparent;border-style:dashed}
.ct-sk{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--suave),#201b1d,var(--suave));background-size:200% 100%;animation:brilho 1.4s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(224,80,107,0)}100%{box-shadow:0 0 0 0 rgba(224,80,107,0)}}
@keyframes brilho{to{background-position:-200% 0}}
@media(max-width:560px){.ct-cta{display:flex;justify-content:center;width:100%}.ct-grid{margin-top:32px}}
@media(prefers-reduced-motion:reduce){.ct-eyebrow i,.ct-sk{animation:none}}
</style></head><body>
<header id="nav"></header>
<main class="ct">
  <span class="ct-eyebrow"><i></i>Fale com a gente</span>
  <h2>Bora jogar<br>com o Eternus?</h2>
  <p class="ct-sub">Quer treinar, marcar um amistoso ou só tirar uma dúvida? Escolha o canal que for mais fácil pra você.</p>
  <div id="cta"></div>
  <div class="ct-grid" id="info"><div class="ct-sk"></div><div class="ct-sk"></div><div class="ct-sk"></div></div>
</main>
<footer><a href="admin/index.html">Admin</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/config.js?v=1793123906"></script><script src="assets/app.js?v=1793123906"></script><script>
nav(false,'contato');

const svg=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
const ICO={
  whatsapp:svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/>'),
  telefone:svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
  email:svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
  instagram:svg('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/>'),
  local:svg('<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>'),
  treinos:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')
};

function canais(c){
  const dig=v=>String(v||'').replace(/\D/g,'');
  const ig=String(c.instagram||'').replace(/^@/,'').trim();
  const l=[];
  if(c.whatsapp) l.push({k:'whatsapp',t:'WhatsApp',v:c.whatsapp,h:'https://wa.me/'+dig(c.whatsapp)+'?text='+encodeURIComponent('Olá! Vim pelo site do Eternus FC.')});
  if(c.instagram&&ig) l.push({k:'instagram',t:'Instagram',v:'@'+ig,h:'https://instagram.com/'+ig});
  if(c.email) l.push({k:'email',t:'E-mail',v:c.email,h:'mailto:'+c.email});
  if(c.telefone) l.push({k:'telefone',t:'Telefone',v:c.telefone,h:'tel:'+dig(c.telefone)});
  if(c.endereco) l.push({k:'local',t:'Local dos jogos',v:c.endereco,h:'https://www.google.com/maps/search/'+encodeURIComponent(c.endereco)});
  if(c.treinos) l.push({k:'treinos',t:'Treinos',v:c.treinos,h:null});
  return l;
}

const cartao=i=>{
  const corpo='<span class="ct-ico">'+ICO[i.k]+'</span><span class="ct-txt"><small>'+esc(i.t)+'</small><strong>'+esc(i.v)+'</strong></span>';
  return i.h
    ?'<a class="ct-card" href="'+esc(i.h)+'"'+(/^https?:/.test(i.h)?' target="_blank" rel="noopener"':'')+'>'+corpo+'<span class="ct-seta" aria-hidden="true">→</span></a>'
    :'<div class="ct-card info-fixa">'+corpo+'</div>';
};

(async()=>{
  const {data,error}=await sb.from('contato').select('*').eq('id',1).maybeSingle();
  if(error){info.innerHTML='<p class="vazio">Não foi possível carregar os contatos.</p>';return}
  const lista=data?canais(data):[];
  if(!lista.length){info.innerHTML='<p class="vazio">Contatos em breve.</p>';return}
  // botão principal: WhatsApp, ou o primeiro canal clicável
  const principal=lista.find(i=>i.k==='whatsapp')||lista.find(i=>i.h&&i.k!=='local');
  if(principal){
    cta.innerHTML='<a class="btn ct-cta" href="'+esc(principal.h)+'"'+(/^https?:/.test(principal.h)?' target="_blank" rel="noopener"':'')+'>'+ICO[principal.k]+(principal.k==='whatsapp'?'Chamar no WhatsApp':'Entrar em contato')+'<span aria-hidden="true">→</span></a>';
  }
  info.innerHTML=lista.filter(i=>i!==principal||i.k!=='whatsapp').map(cartao).join('');
})();
</script></body></html>
